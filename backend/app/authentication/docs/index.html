<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google login test</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 20px; font-family: system-ui, sans-serif; }
      label { display: block; margin-top: 24px; margin-bottom: 8px; }
      input, textarea { box-sizing: border-box; width: 100%; padding: 10px; }
      button { margin: 12px 0; padding: 10px 16px; cursor: pointer; }
      #google-button { margin-top: 16px; }
      #status { min-height: 24px; }
    </style>
  </head>
  <body>
    <h1>Google login test</h1>
    <p>Paste the same Google Client ID configured in your backend.</p>
    <form id="setup">
      <label for="client-id">Google Client ID</label>
      <input id="client-id" placeholder="your-id.apps.googleusercontent.com" required autocomplete="off">
      <button id="initialize" type="submit" disabled>Show Google sign-in</button>
    </form>
    <div id="google-button"></div>
    <p id="status" role="status">Loading Google sign-in…</p>
    <label for="token">Google ID token</label>
    <textarea id="token" rows="10" readonly></textarea>
    <p>Copy this token into the <code>credential</code> field of <code>POST /auth/google</code> in your backend’s <code>/docs</code> page.</p>
    <script>
      const status = document.getElementById("status");
      function googleLoaded() {
        document.getElementById("initialize").disabled = false;
        status.textContent = "Enter your Client ID to begin.";
      }
      function googleFailed() {
        status.textContent = "Could not load Google sign-in. Check your connection and reload.";
      }
      document.getElementById("setup").addEventListener("submit", function (event) {
        event.preventDefault();
        const clientId = document.getElementById("client-id").value.trim();
        if (!clientId.endsWith(".apps.googleusercontent.com")) {
          status.textContent = "Enter a Google Client ID ending in .apps.googleusercontent.com.";
          return;
        }
        google.accounts.id.initialize({
          client_id: clientId,
          callback: function (response) {
            document.getElementById("token").value = response.credential;
            status.textContent = "Signed in. Your Google ID token is ready to copy.";
          }
        });
        google.accounts.id.renderButton(document.getElementById("google-button"), {
          theme: "outline", size: "large"
        });
        document.getElementById("initialize").disabled = true;
        document.getElementById("client-id").readOnly = true;
        status.textContent = "Click the Google button to sign in. Reload to change the Client ID.";
      });
    </script>
    <script src="https://accounts.google.com/gsi/client" async onload="googleLoaded()" onerror="googleFailed()"></script>
  </body>
</html>
