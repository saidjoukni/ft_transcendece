# Google's JSON state cookie triggers these SQL-injection rules. Browsers send
# it on page requests as well as API calls, so exclude only this cookie site-wide.
SecAction \
    "id:10001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=942200;REQUEST_COOKIES:g_state,\
    ctl:ruleRemoveTargetById=942340;REQUEST_COOKIES:g_state,\
    ctl:ruleRemoveTargetById=942370;REQUEST_COOKIES:g_state"

# Passwords may contain shell-like punctuation at registration and login.
# Exclude only the JSON password field from the observed false-positive rule.
SecRule REQUEST_URI "@rx ^/api/auth/(?:login|register)(?:\?.*)?$" \
    "id:10002,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,ctl:ruleRemoveTargetById=932240;ARGS:json.password"
